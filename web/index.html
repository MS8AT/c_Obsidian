<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>c_Obsidian · Idea Atlas</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/prism.css"></head>
<body>
<aside class="sidebar">
 <a class="brand" href="/" aria-label="c Obsidian"><span class="gem">◈</span> c_Obsidian <small data-i18n="atlas"></small></a>
 <div class="space-label" data-i18n="workspace"></div><button type="button" class="vault-name" id="vault-name" aria-haspopup="dialog">…</button>
 <div class="side-bottom"><div class="local-dot"><i></i><span data-i18n="local"></span></div><p data-i18n="privacy"></p><a href="https://github.com/nickmilo/ideaverse-maps" target="_blank" rel="noreferrer" data-i18n="inspiration"></a><small>c_Obsidian <span id="build-version">…</span> · <span data-i18n="localEdition"></span></small></div>
</aside>
<main>
 <header><nav id="views" class="top-views" aria-label="Карты идей"><button data-view="prism" class="active"><span aria-hidden="true">◇</span><span data-i18n="prismName">Призма</span></button><button data-view="emergence"><span aria-hidden="true">↟</span><span data-i18n="emergenceName"></span></button><button data-view="starfield"><span aria-hidden="true">✧</span><span data-i18n="starfieldName"></span></button><button data-view="gravity"><span aria-hidden="true">◎</span><span data-i18n="gravityName"></span></button><button data-view="sensemakers"><span aria-hidden="true">⊞</span><span data-i18n="sensemakersName"></span></button><button data-view="photos"><span aria-hidden="true">▧</span><span data-i18n="photos"></span></button><button id="open-prism" type="button" aria-haspopup="dialog"><span aria-hidden="true">◇</span><span data-i18n="prototypeName"></span></button></nav><div class="actions" role="toolbar" aria-label="Основные действия"><div class="language-switch" role="group" aria-label="Language / Язык / 语言"><span aria-hidden="true">◎</span><button type="button" data-language="ru" aria-label="Русский" title="Русский" aria-pressed="true">RU</button><button type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">EN</button><button type="button" data-language="zh" aria-label="简体中文" title="简体中文" aria-pressed="false">中文</button></div><div class="action-group"><button id="storage" class="quiet"><span class="action-icon" aria-hidden="true">◈</span><span class="action-text" data-i18n="storage"></span></button><button id="refresh" class="quiet"><span class="action-icon" aria-hidden="true">↻</span><span class="action-text" data-i18n="refresh"></span></button><button id="new-note" class="primary"><span class="action-icon" aria-hidden="true">＋</span><span class="action-text" data-i18n="newNoteShort"></span></button><button id="logout" class="quiet" hidden><span class="action-icon" aria-hidden="true">⇥</span><span class="action-text" data-i18n="logout"></span></button></div></div></header>
 <section class="heading"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 id="view-title"></h1><p id="view-description"></p></div><span class="edition" data-i18n="edition"></span></section>
 <section class="stats" id="stats"></section>
 <div class="map-toolbar"><div class="map-title"><i></i><b id="map-caption">EMERGENCE</b></div><div class="map-controls"><input type="search" id="search" aria-label="Search"><select id="group"><option value="time" data-i18n="time"></option><option value="folder" data-i18n="folder"></option></select><button id="play" data-i18n="play"></button><button id="upload" data-i18n="upload"></button><input type="file" accept="image/png,image/jpeg,image/gif,image/webp" id="image-file" hidden></div></div>
 <div class="work-area"><section class="map-shell"><div id="map" role="region" aria-label="Notes map"></div><div class="map-footer"><span id="map-hint" data-i18n="hint"></span><span id="timeline"></span></div></section><aside class="inspector" id="inspector"><div class="space-label" data-i18n="inspector"></div><div id="note-details"></div></aside></div>
 <section class="insights"><div><span class="eyebrow" data-i18n="next"></span><p id="insight"></p></div><span class="policy" data-i18n="policy"></span></section>
 <p id="message" role="status" aria-live="polite"></p>
 <footer><span data-i18n="footer"></span><span>API · CLI · Markdown</span></footer>
</main>
<dialog id="create-dialog"><form id="create-form"><h2 data-i18n="newNote"></h2><label data-i18n="notePath" for="note-path"></label><input id="note-path" required value="Inbox/"><label data-i18n="content" for="note-content"></label><textarea id="note-content" rows="12" required></textarea><div class="dialog-actions"><button type="button" id="cancel-create" data-i18n="cancel"></button><button type="submit" class="primary" data-i18n="create"></button></div><p id="create-error" role="alert"></p></form></dialog>
<dialog id="edit-dialog"><form id="edit-form"><h2 data-i18n="editNote"></h2><label data-i18n="notePath" for="edit-path"></label><input id="edit-path" readonly><p class="editor-help" data-i18n="editorHelp"></p><label data-i18n="content" for="edit-content"></label><textarea id="edit-content" rows="20" spellcheck="false" required></textarea><div class="dialog-actions"><button type="button" id="cancel-edit" data-i18n="cancel"></button><button type="submit" class="primary" data-i18n="save"></button></div><p id="edit-error" role="alert"></p></form></dialog>
<dialog id="storage-dialog"><h2 data-i18n="storageTitle"></h2><div class="storage-summary"><span data-i18n="currentStorage"></span><strong id="storage-vault">…</strong></div><p data-i18n="storageExplanation"></p><p class="storage-warning" data-i18n="storageWarning"></p><input type="file" id="vault-folder" webkitdirectory multiple hidden><div class="dialog-actions"><button type="button" id="cancel-storage" data-i18n="close"></button><button type="button" id="example-storage" class="quiet" data-i18n="exampleStorage"></button><button type="button" id="import-folder" class="primary" data-i18n="importFolder"></button></div><p id="storage-progress" class="storage-progress" role="status" aria-live="polite"></p></dialog>
<dialog id="prism-dialog" class="prism-dialog" aria-labelledby="prism-title"><div class="prism-toolbar"><h2 id="prism-title" data-i18n="prototypeName"></h2><div><button id="prism-edit" type="button" data-i18n="prismEdit"></button><button id="prism-upload" type="button" data-i18n="prismUpload"></button><button id="prism-reset" type="button" data-i18n="prismReset"></button><input id="prism-file" type="file" accept=".html,.htm,text/html" hidden><button id="prism-download" type="button" data-i18n="prismDownload"></button><button id="prism-close" type="button" data-i18n="close"></button></div></div><p class="prism-description" data-i18n="prismDescription"></p><p id="prism-message" role="status" aria-live="polite"></p><iframe id="prism-frame" title="Призма различений — прототип" sandbox="allow-scripts allow-modals" referrerpolicy="no-referrer"></iframe></dialog>
<dialog id="prism-editor-dialog" class="prism-editor-dialog" aria-labelledby="prism-editor-title"><form id="prism-editor-form"><h2 id="prism-editor-title" data-i18n="prismEdit"></h2><label for="prism-editor-content" data-i18n="prismSource"></label><textarea id="prism-editor-content" rows="22" spellcheck="false" required></textarea><p id="prism-editor-error" role="alert"></p><div class="dialog-actions"><button id="prism-editor-cancel" type="button" data-i18n="cancel"></button><button id="prism-editor-save" type="submit" data-i18n="save"></button></div></form></dialog>
<script src="/app.js"></script><script src="/prism.js"></script></body></html>
