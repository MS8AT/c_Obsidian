# Activate only AFTER a valid certificate exists at the verified gateway path.
server {
    listen 8443 ssl;
    server_name obsidian.ms8at.by;
    ssl_certificate /etc/letsencrypt/live/obsidian.ms8at.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obsidian.ms8at.by/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://10.6.0.30:8080;
        proxy_set_header Host obsidian.ms8at.by;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
}
