# Proposed addition to the EXISTING QR gateway, after exact config paths are verified.
# Keep existing QR server blocks unchanged.
server {
    listen 8080;
    server_name obsidian.ms8at.by;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 308 https://obsidian.ms8at.by$request_uri;
    }
}
